baseURL: "https://jeison-souza.github.io/MeepleZone/"
locale: fr-ca
defaultContentLanguage: "fr"
title: MeepleZone
theme: papermod
enableRobotsTXT: true

params:
  description: Journal de bord technique de MeepleZone, une application web de gestion de collection de jeux de société réalisée dans le cadre du cours INF-1410.
  author: Jeison Souza
  disableSpecial1stPost: false
  keywords: ["Blog", "Développement", "INF-1410", "Projet", "Jeison Souza"]

  # Apparence et comportement
  defaultTheme: dark

  # Fonctions de lecture et de navigation
  showReadingTime: true
  ShowShareButtons: false
  showPostNavLinks: true
  showBreadcrumbs: true
  showCodeCopyButton: true

  # Active le bloc d'introduction de la page d'accueil, qui affiche aussi les icônes sociales
  homeInfoParams:
    Title: "Le journal de bord de MeepleZone 🎲"
    Content: "Organiser, partager, jouer : voici les coulisses de **MeepleZone**, une application web pour gérer sa ludothèque, découvrir celle de ses amis et planifier des soirées de jeux. Ce journal suit le projet pas à pas : idées, choix techniques, décisions d'architecture et défis rencontrés en cours de route."

  # Réseaux sociaux (liste d'icônes)
  socialIcons:
    - name: "github"
      title: "Voir le code source sur GitHub"
      url: "https://github.com/jeison-souza/MeepleZone"

menus:
  main:
    - identifier: "posts"
      name: "Posts"
      url: "/posts/"
      weight: 1

    # - identifier: "todo"
    #   name: "ToDo"
    #   url: "/todo/"
    #   weight: 99

    - identifier: "tags"
      name: "Tags"
      url: "/tags/"
      weight: 3

    - identifier: "categories"
      name: "Catégories"
      url: "/categories/"
      weight: 4

    - identifier: "search"
      name: "Recherche"
      url: "/search/"
      weight: 5

markup:
  goldmark:
    parser:
      attribute:
        block: true

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
