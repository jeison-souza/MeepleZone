name: Pipeline CI .NET

on:
  push:
    branches: [ "main" ]
    paths:
      - 'code source/**'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'code source/'

    steps:
    - name: Récupérer le dépôt (Checkout)
      uses: actions/checkout@v4

    - name: Vérifier les fichiers modifiés
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          src:
            - 'code source/**'

    - name: Configurer le SDK .NET
      if: steps.changes.outputs.src == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Détecter les solutions
      if: steps.changes.outputs.src == 'true'
      run: |
        find . \( -name '*.slnx' -o -name '*.sln' \) -not -path '*/.vs/*' | sort > "$RUNNER_TEMP/solutions.txt"
        echo "Solutions détectées :"
        cat "$RUNNER_TEMP/solutions.txt"
        if [ ! -s "$RUNNER_TEMP/solutions.txt" ]; then
          echo "::error::Aucune solution trouvée sous 'code source/'"
          exit 1
        fi

    - name: Restaurer les dépendances
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::restore $sln"
          dotnet restore "$sln"
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

    - name: Compiler les solutions
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::build $sln"
          dotnet build "$sln" --no-restore --configuration Release
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

    - name: Exécuter les tests unitaires
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::test $sln"
          dotnet test "$sln" --no-build --configuration Release --verbosity normal
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"