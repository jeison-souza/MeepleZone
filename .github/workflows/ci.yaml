name: Pipeline CI .NET

on:
  push:
    branches: [ "main" ]
    # Une étiquette de version (v0.3.0) publie l'image numérotée; le filtre de chemins ne s'applique pas aux étiquettes.
    tags: [ "v*" ]
    paths:
      - 'code source/**'
  pull_request:
    branches: [ "main" ]
  # Déclenchement manuel (bouton « Run workflow »), sur main : reconstruit, publie et redéploie.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'code source/'

    steps:
    - name: Récupérer le dépôt (Checkout)
      uses: actions/checkout@v4

    - name: Vérifier les fichiers modifiés
      id: filtre
      if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
      uses: dorny/paths-filter@v3
      with:
        filters: |
          src:
            - 'code source/**'

    # Un déclenchement manuel ou une étiquette de version n'a pas de différence à comparer : le code est toujours concerné.
    - name: Déterminer si le code est concerné
      id: changes
      env:
        EVENEMENT: ${{ github.event_name }}
        TYPE_REF: ${{ github.ref_type }}
        FILTRE: ${{ steps.filtre.outputs.src }}
      run: |
        if [ "$EVENEMENT" = "workflow_dispatch" ] || [ "$TYPE_REF" = "tag" ]; then
          echo "src=true" >> "$GITHUB_OUTPUT"
        else
          echo "src=${FILTRE}" >> "$GITHUB_OUTPUT"
        fi

    - name: Configurer le SDK .NET
      if: steps.changes.outputs.src == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Détecter les solutions
      if: steps.changes.outputs.src == 'true'
      run: |
        find . \( -name '*.slnx' -o -name '*.sln' \) -not -path '*/.vs/*' | sort > "$RUNNER_TEMP/solutions.txt"
        echo "Solutions détectées :"
        cat "$RUNNER_TEMP/solutions.txt"
        if [ ! -s "$RUNNER_TEMP/solutions.txt" ]; then
          echo "::error::Aucune solution trouvée sous 'code source/'"
          exit 1
        fi

    - name: Restaurer les dépendances
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::restore $sln"
          dotnet restore "$sln"
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

    - name: Compiler les solutions
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::build $sln"
          dotnet build "$sln" --no-restore --configuration Release
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

    - name: Exécuter les tests unitaires
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::test $sln"
          dotnet test "$sln" --no-build --configuration Release --verbosity normal
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

  # Livraison continue : après un push sur main ou une étiquette de version (jamais pour un PR) et des tests réussis.
  publier-image:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Récupérer le dépôt (Checkout)
      uses: actions/checkout@v4

    - name: Configurer Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Ouvrir une session sur GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Le nom de l'image est mis en minuscules automatiquement (exigé par le registre).
    - name: Calculer les étiquettes de l'image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        # Sur main : « latest » et « sha-<commit> ». Sur une étiquette v0.3.0 : « 0.3.0 » et « 0.3 »,
        # sans déplacer « latest », qui reste réservée à main (c'est elle qui est déployée).
        flavor: |
          latest=false
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=sha,prefix=sha-,format=long,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Construire et publier l'image
      uses: docker/build-push-action@v6
      with:
        context: 'code source/MeepleZone'
        file: 'code source/MeepleZone/Dockerfile'
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Déclenche le redéploiement sur le serveur puis vérifie que le site répond.
  # Inactif tant que la variable de dépôt CD_ACTIF n'est pas « true » (webhook pas encore en place).
  deployer:
    needs: publier-image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CD_ACTIF == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement
      cancel-in-progress: false
    steps:
    - name: Déclencher le redéploiement
      env:
        DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
      run: |
        curl --fail --silent --show-error --max-time 30 -X POST \
          -H "X-Deploy-Token: ${DEPLOY_WEBHOOK_TOKEN}" \
          "${DEPLOY_WEBHOOK_URL}"

    - name: Vérifier que le site répond
      env:
        SITE_URL: ${{ vars.SITE_URL }}
      run: |
        # Laisse le temps au serveur de télécharger l'image et de recréer le conteneur (migrations comprises).
        sleep 45
        for tentative in $(seq 1 20); do
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "${SITE_URL}" || true)
          echo "Tentative ${tentative} : HTTP ${code}"
          if [ "${code}" = "200" ]; then
            exit 0
          fi
          sleep 15
        done
        echo "::error::Le site n'a pas répondu 200 après le déploiement (${SITE_URL})."
        exit 1