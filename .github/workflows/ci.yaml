name: Pipeline CI .NET

on:
  push:
    branches: [ "main" ]
    # Une étiquette de version (v0.3.0) publie l'image numérotée; le filtre de chemins ne s'applique pas aux étiquettes.
    tags: [ "v*" ]
    paths:
      - 'code source/**'
  pull_request:
    branches: [ "main" ]
  # Déclenchement manuel (bouton « Run workflow »), sur main : reconstruit, publie et redéploie.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'code source/'

    steps:
    - name: Récupérer le dépôt (Checkout)
      uses: actions/checkout@v7

    - name: Vérifier les fichiers modifiés
      id: filtre
      if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
      uses: dorny/paths-filter@v4
      with:
        filters: |
          src:
            - 'code source/**'

    # Un déclenchement manuel ou une étiquette de version n'a pas de différence à comparer : le code est toujours concerné.
    - name: Déterminer si le code est concerné
      id: changes
      env:
        EVENEMENT: ${{ github.event_name }}
        TYPE_REF: ${{ github.ref_type }}
        FILTRE: ${{ steps.filtre.outputs.src }}
      run: |
        if [ "$EVENEMENT" = "workflow_dispatch" ] || [ "$TYPE_REF" = "tag" ]; then
          echo "src=true" >> "$GITHUB_OUTPUT"
        else
          echo "src=${FILTRE}" >> "$GITHUB_OUTPUT"
        fi

    - name: Configurer le SDK .NET
      if: steps.changes.outputs.src == 'true'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Détecter les solutions
      if: steps.changes.outputs.src == 'true'
      run: |
        find . \( -name '*.slnx' -o -name '*.sln' \) -not -path '*/.vs/*' | sort > "$RUNNER_TEMP/solutions.txt"
        echo "Solutions détectées :"
        cat "$RUNNER_TEMP/solutions.txt"
        if [ ! -s "$RUNNER_TEMP/solutions.txt" ]; then
          echo "::error::Aucune solution trouvée sous 'code source/'"
          exit 1
        fi

    - name: Restaurer les dépendances
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::restore $sln"
          dotnet restore "$sln"
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

    - name: Compiler les solutions
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::build $sln"
          dotnet build "$sln" --no-restore --configuration Release
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

    - name: Exécuter les tests unitaires
      if: steps.changes.outputs.src == 'true'
      run: |
        while read -r sln; do
          echo "::group::test $sln"
          dotnet test "$sln" --no-build --configuration Release --verbosity normal
          echo "::endgroup::"
        done < "$RUNNER_TEMP/solutions.txt"

  # Livraison continue : après un push sur main ou une étiquette de version (jamais pour un PR) et des tests réussis.
  publier-image:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      numero: ${{ steps.version.outputs.numero }}
    steps:
    - name: Récupérer le dépôt (Checkout)
      uses: actions/checkout@v7

    # Sur une étiquette v0.3.1 : « 0.3.1 ». Sinon : date du build (heure du Québec) et numéro de l'exécution,
    # suivi du numéro de tentative si l'exécution est relancée (deux builds n'ont jamais le même numéro).
    - name: Calculer le numéro de version
      id: version
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          numero="${GITHUB_REF_NAME#v}"
        else
          numero="$(TZ=America/Toronto date +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            numero="${numero}.${GITHUB_RUN_ATTEMPT}"
          fi
        fi
        echo "Version : ${numero}"
        echo "numero=${numero}" >> "$GITHUB_OUTPUT"

    - name: Configurer Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Ouvrir une session sur GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Le nom de l'image est mis en minuscules automatiquement (exigé par le registre).
    - name: Calculer les étiquettes de l'image
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        # Sur main : « latest » et « sha-<commit> ». Sur une étiquette v0.3.0 : « 0.3.0 » et « 0.3 »,
        # sans déplacer « latest », qui reste réservée à main (c'est elle qui est déployée).
        flavor: |
          latest=false
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=sha,prefix=sha-,format=long,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Construire et publier l'image
      uses: docker/build-push-action@v7
      with:
        context: 'code source/MeepleZone'
        file: 'code source/MeepleZone/Dockerfile'
        push: true
        build-args: |
          VERSION_NUMERO=${{ steps.version.outputs.numero }}
          VERSION_COMMIT=${{ github.sha }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Déclenche le redéploiement sur le serveur puis vérifie que le site sert la version qui vient d'être publiée.
  # Inactif tant que la variable de dépôt CD_ACTIF n'est pas « true » (webhook pas encore en place).
  deployer:
    needs: publier-image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CD_ACTIF == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement
      cancel-in-progress: false
    steps:
    - name: Déclencher le redéploiement
      env:
        DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
      run: |
        curl --fail --silent --show-error --max-time 30 -X POST \
          -H "X-Deploy-Token: ${DEPLOY_WEBHOOK_TOKEN}" \
          "${DEPLOY_WEBHOOK_URL}"

    - name: Vérifier que la nouvelle version est en ligne
      env:
        SITE_URL: ${{ vars.SITE_URL }}
        VERSION_ATTENDUE: ${{ needs.publier-image.outputs.numero }}
      run: |
        # L'ancien conteneur répond encore pendant le téléchargement de l'image : seul le numéro de version
        # prouve que le redéploiement a eu lieu (migrations comprises).
        echo "Version attendue : ${VERSION_ATTENDUE}"
        for tentative in $(seq 1 30); do
          sleep 15
          code=$(curl --silent --max-time 15 --output "$RUNNER_TEMP/version.txt" --write-out '%{http_code}' \
            "${SITE_URL%/}/version?essai=${tentative}" || true)
          recue=""
          # Seule une réponse qui ressemble à un numéro de version est affichée dans le journal.
          if [ "${code}" = "200" ] && grep -qxE '[0-9A-Za-z.-]{1,40}' "$RUNNER_TEMP/version.txt"; then
            recue=$(cat "$RUNNER_TEMP/version.txt")
          fi
          echo "Tentative ${tentative} : HTTP ${code} ${recue}"
          if [ "${recue}" = "${VERSION_ATTENDUE}" ]; then
            exit 0
          fi
        done
        echo "::error::La version ${VERSION_ATTENDUE} n'est pas en ligne après le déploiement."
        exit 1